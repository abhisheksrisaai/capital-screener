name: Capital Screener Data Refresh

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-ingest all companies"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ingestion pipeline
        timeout-minutes: 60
        working-directory: backend
        env:
          FULL_REFRESH: ${{ inputs.full_refresh || 'false' }}
        run: python -m ingest.main

      - name: Commit processed artifacts
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed/
          git diff --staged --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
