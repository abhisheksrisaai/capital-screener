version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: capital-screener-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: capital-screener-api
    ports:
      - "8000:8000"
    environment:
      QDRANT_MODE: remote
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DATABASE_URL: sqlite:////app/data/screener.db
      DATA_DIR: /data
      FRONTEND_URL: http://localhost:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - qdrant
    volumes:
      - ./data:/data
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capital-screener-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_storage:
  backend_data:
